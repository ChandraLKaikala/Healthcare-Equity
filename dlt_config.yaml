# Databricks Delta Live Tables (DLT) Pipeline Configuration
# This YAML configures the healthcare equity bias detection DLT pipeline

name: "healthcare_equity_dlt"
description: "Healthcare Equity Bias Detection - Delta Live Tables Pipeline"

# Storage configuration
storage: "/Workspace/Users/Workspace/healthcare_equity_dlt"
target: "healthcare_equity_gold"

# Catalog and schema configuration
# When deploying to Databricks, this will create tables in specified catalog/schema
configuration:
  pipelines_to_run: "dlt_pipeline"

# Cluster configuration for DLT
clusters:
  - label: "default"
    spark_conf:
      spark.databricks.cluster.profile: "singleNode"
    node_type_id: "i3.xlarge"
    num_workers: 0

# Libraries and dependencies
libraries:
  - notebook:
      path: "/Workspace/dlt_pipeline"

# Trigger configuration - define when pipeline runs
# Options: continuous, triggered, or on_demand
trigger:
  continuous: false  # Don't run continuously - Bronze layer mutation handles that
  frequency: 5       # Run every 5 minutes to process new Bronze data

# Development vs Production
development: false   # This is production configuration

# Notifications (optional)
notifications:
  email_notifications:
    on_failure:
      - "admin@healthcare.com"

# Channel specification for stability
channel: "CURRENT"

# Allow-list for accessing external resources
allow_duplicate_names: false
