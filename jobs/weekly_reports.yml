name: Healthcare Equity - Weekly Regulatory Reports
tasks:
  - task_key: generate_reports
    description: "Generate CMS, JC, OCR, NCQA compliance reports"
    depends_on: []
    timeout_seconds: 7200
    max_retries: 1
    
    python_wheel_task:
      package_name: healthcare_equity
      entry_point: jobs.reports:generate_all_reports
      
    new_cluster:
      spark_version: "13.3.x-scala2.12"
      node_type_id: "i3.xlarge"
      num_workers: 2

schedule:
  quartz_cron_expression: "0 0 ? * MON" # Every Monday at midnight
  timezone_id: "UTC"
  pause_status: "UNPAUSED"
