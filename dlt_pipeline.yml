name: Healthcare Equity DLT Pipeline
target: healthcare_equity_prod
tables:
  bronze_patients:
    sql: |
      SELECT * FROM healthcare_equity_bronze.patients
    
  bronze_decisions:
    sql: |
      SELECT * FROM healthcare_equity_bronze.decisions
    
  silver_patients_processed:
    sql: |
      SELECT 
        patient_id,
        gender,
        race,
        sexual_orientation,
        age,
        insurance_type,
        sofa_score,
        cci_score,
        ses_quintile,
        CASE WHEN sofa_score >= 15 THEN 'HIGH' ELSE 'NORMAL' END as risk_level,
        current_timestamp() as processed_at
      FROM bronze_patients
      WHERE patient_id IS NOT NULL
    
  silver_decisions_processed:
    sql: |
      SELECT 
        decision_id,
        patient_id,
        scenario_type,
        decision,
        decision_date,
        current_timestamp() as processed_at
      FROM bronze_decisions
      WHERE decision_id IS NOT NULL
    
  gold_bias_metrics:
    sql: |
      SELECT 
        scenario_type,
        race,
        COUNT(*) as decision_count,
        SUM(CASE WHEN decision = 'Recommended' THEN 1 ELSE 0 END) / COUNT(*) as approval_rate,
        ROUND(SUM(CASE WHEN decision = 'Recommended' THEN 1 ELSE 0 END) / COUNT(*) * 100, 2) as approval_pct,
        current_timestamp() as calculated_at
      FROM silver_decisions_processed d
      JOIN silver_patients_processed p ON d.patient_id = p.patient_id
      GROUP BY scenario_type, race
    
  gold_equity_dashboard:
    sql: |
      SELECT 
        COUNT(DISTINCT p.patient_id) as total_patients,
        COUNT(DISTINCT d.decision_id) as total_decisions,
        SUM(CASE WHEN p.gender = 'F' THEN 1 ELSE 0 END) as female_patients,
        SUM(CASE WHEN p.race = 'Black' THEN 1 ELSE 0 END) as black_patients,
        ROUND(AVG(p.sofa_score), 2) as avg_severity,
        current_timestamp() as last_updated
      FROM silver_patients_processed p
      LEFT JOIN silver_decisions_processed d ON p.patient_id = d.patient_id
